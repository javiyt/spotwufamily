name: Pages Deploy

on:
  workflow_run:
    workflows: [Pages, Pages Preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: publish-github-pages
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Run from the default branch, including when a PR produced the static
      # preview. Only read static output from gh-pages; never execute PR code.
      - name: Checkout assembled site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages-artifact
          persist-credentials: false

      - name: Verify assembled site
        run: test -f pages-artifact/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

      # deploy-pages queries the artifact API right after upload; the
      # artifact can take a short while before it is visible there.
      - name: Wait for Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            size="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .size_in_bytes')"
            if [[ -n "${size}" && "${size}" -gt 0 ]]; then
              echo "github-pages artifact visible (size=${size} bytes)"
              exit 0
            fi
            echo "artifact not visible yet, waiting 10s (${i}/30)"
            sleep 10
          done
          echo "github-pages artifact never became visible" >&2
          exit 1

      - name: Deploy assembled site
        id: deployment
        uses: actions/deploy-pages@v5
