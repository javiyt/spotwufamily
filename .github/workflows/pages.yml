name: Pages

on:
  push:
    branches: [main]
    paths:
      - "data/catalog.db"
      - "data/catalog.snapshot.sql"
      - "data/artists.yaml"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Verify and export
        run: |
          go run ./cmd/spotwufamily db verify
          go run ./cmd/spotwufamily export

      - name: Build Hugo
        run: go run ./cmd/spotwufamily site build --source site --destination ../public

      - name: Verify Pages artifact
        run: test -d public && test -f public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5