# Mergify configuration - queue and squash-merge javiyt's PRs after CI passes
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    update_method: rebase
    queue_conditions:
      - "author=javiyt"
      - "status-success=*"
      - "base=main"
      - "-conflict"
      - "-draft"
    merge_conditions:
      - "author=javiyt"
      - "status-success=*"
      - "base=main"
      - "-conflict"
      - "-draft"

pull_request_rules:
  - name: Queue javiyt's PRs after CI passes
    conditions:
      - "author=javiyt"
      - "status-success=*"
      - "base=main"
      - "-conflict"
      - "-draft"
    actions:
      queue:
        name: default
