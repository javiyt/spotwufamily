{{ define "main" }}
  <section class="shell page-head">
    <p class="eyebrow">Shuffle</p>
    <h1>Random Mix</h1>
  </section>
  <section class="shell section">
    <div class="mix-panel" data-random-mix data-random-limit="24">
      <div class="mix-toolbar">
        <button class="button" type="button" data-random-refresh>Shuffle tracks</button>
        <a class="button button-secondary" data-random-spotify href="https://open.spotify.com/" target="_blank" rel="noopener">Open in Spotify</a>
      </div>
      <div class="mix-player" data-random-player>
        <p class="empty">Loading random tracks.</p>
      </div>
      <ol class="mix-list" data-random-list></ol>
      <p class="empty" data-random-empty hidden>No tracks available yet. Run a Spotify sync and export the catalog.</p>
    </div>
  </section>
{{ end }}
